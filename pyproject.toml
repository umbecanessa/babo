[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nls"
version = "0.1.0"
description = "Neural Ledger State — Persistent neural identity via chained low-rank adaptation and cryptographic state verification."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NLS Contributors"},
]
dependencies = [
    "llama-cpp-python>=0.3.0",
    "peft>=0.13.0",
    "transformers>=4.45.0",
    "torch>=2.1.0",
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "playwright>=1.40.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
train = [
    "unsloth>=2024.12",
    "bitsandbytes>=0.44.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
nls = "nls.cli:app"

[tool.setuptools.packages.find]
include = ["nls*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
