<div class="app-shell">
  <!-- Nav bar (when authenticated, or always in Electron desktop mode) -->
  @if (auth.isAuthenticated() || platform.isElectron) {
    <nav class="nav-bar">
      <!-- Left: brand + global nav -->
      <div class="nav-left">
        <a routerLink="/dashboard" class="nav-brand">
          <div class="nav-orb">
            <div class="nav-orb-core"></div>
            <div class="nav-orb-ring"></div>
          </div>
          <img src="assets/images/babo.png" alt="Babo" class="nav-logo-icon" />
          <span class="nav-logo">Babo</span>
        </a>

        <div class="nav-links">
          <a routerLink="/dashboard" routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }">
            <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
              <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
            </svg>
            <span>Agents</span>
          </a>
          <!-- IDE tab removed — functionality folded into Projects Dashboard -->
        </div>
      </div>

      <!-- Center: agent-context tabs (only visible inside an agent) -->
      @if (hasAgentContext()) {
        <div class="nav-agent-tabs">
          <a [routerLink]="['/chat', activeAgentId()]" routerLinkActive="active">
            <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
              <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zm-5 0H8v2h2V9z" clip-rule="evenodd"/>
            </svg>
            <span>Chat</span>
          </a>
          <a [routerLink]="['/projects', activeAgentId()]" routerLinkActive="active">
            <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
              <path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/>
              <path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm9.707 5.707a1 1 0 00-1.414-1.414L9 12.586l-1.293-1.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span>Projects</span>
          </a>
          <a [routerLink]="['/tools', activeAgentId()]" routerLinkActive="active">
            <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
              <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
            </svg>
            <span>Tools</span>
          </a>
          <a [routerLink]="['/memory', activeAgentId()]" routerLinkActive="active">
            <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
              <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
            </svg>
            <span>Memory</span>
          </a>
          <a [routerLink]="['/brain', activeAgentId()]" routerLinkActive="active">
            <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
              <path d="M13 7H7v6h6V7z"/>
              <path fill-rule="evenodd" d="M7 2a1 1 0 012 0v1h2V2a1 1 0 112 0v1h2a2 2 0 012 2v2h1a1 1 0 110 2h-1v2h1a1 1 0 110 2h-1v2a2 2 0 01-2 2h-2v1a1 1 0 11-2 0v-1H9v1a1 1 0 11-2 0v-1H5a2 2 0 01-2-2v-2H2a1 1 0 110-2h1V9H2a1 1 0 010-2h1V5a2 2 0 012-2h2V2zM5 5h10v10H5V5z" clip-rule="evenodd"/>
            </svg>
            <span>Brain</span>
          </a>
        </div>
      }

      <!-- Right: update + settings + logout -->
      <div class="nav-right">
        @if (updateService.updateAvailable()) {
          <app-update-banner />
        }
        <a routerLink="/settings" routerLinkActive="active" class="nav-settings"
           title="Settings">
          <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
            <path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd"/>
          </svg>
        </a>
        <button (click)="logout()" class="nav-signout" title="Sign out">
          <svg viewBox="0 0 20 20" fill="currentColor" class="nav-icon">
            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>
    </nav>
  }

  <!-- Main content -->
  <main [class]="(auth.isAuthenticated() || platform.isElectron) ? 'with-nav' : ''">
    <router-outlet />
  </main>

  <!-- Global toast notifications -->
  <app-toasts />

  <!-- Update notification modal (shows once when update first detected) -->
  @if (platform.isElectron) {
    <app-update-modal />
  }
</div>
