<div class="modal-overlay modal-overlay--confirm confirm-overlay" role="presentation">
  <div class="modal-scrim confirm-backdrop" (click)="onBackdropClick()" aria-hidden="true"></div>
  <div class="modal-panel confirm-panel" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <h3 class="confirm-title">{{ title() }}</h3>
    <p class="confirm-message">{{ message() }}</p>
    @if (showOption()) {
      <label class="confirm-option">
        <input
          type="checkbox"
          [checked]="optionChecked()"
          (change)="onOptionChange($event)"
        />
        <span>{{ optionLabel() }}</span>
      </label>
    }
    <div class="confirm-actions">
      <button type="button" class="btn-secondary" (click)="onCancelClick($event)">
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="btn-confirm"
        [class.btn-danger]="variant() === 'danger'"
        (click)="onConfirmClick($event)"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
