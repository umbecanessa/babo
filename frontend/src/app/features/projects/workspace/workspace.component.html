<div class="workspace" [class.shell-open]="shellOpen()">
  <div class="workspace-main">
    <aside class="explorer-pane" [style.width.px]="explorerWidth()">
      <app-workspace-explorer
        [rootPath]="rootPath()"
        [activePath]="activePath()"
        [shellOpen]="shellOpen()"
        [busy]="uploading()"
        (fileOpen)="openFile($event)"
        (createFile)="promptNewFile()"
        (createFolder)="promptNewFolder()"
        (uploadFiles)="triggerFileUpload()"
        (uploadFolder)="triggerFolderUpload()"
        (toggleShell)="toggleShell()"
      />
    </aside>

    <div
      class="split-handle"
      (mousedown)="onResizeStart($event)"
      title="Drag to resize"
    ></div>

    <section class="editor-pane">
      <app-workspace-editor
        [tabs]="tabs()"
        [activePath]="activePath()"
        (tabSelect)="selectTab($event)"
        (tabClose)="closeTab($event)"
        (tabDirty)="onTabDirty($event)"
        (save)="saveTab($event)"
      />
    </section>
  </div>

  @if (shellOpen()) {
    <app-workspace-terminal [cwd]="rootPath()" (closed)="shellOpen.set(false)" />
  }

  <input
    #fileUploadInput
    type="file"
    multiple
    hidden
    (change)="onFilesSelected($event)"
  />
  <input
    #folderUploadInput
    type="file"
    multiple
    hidden
    webkitdirectory
    (change)="onFilesSelected($event)"
  />
</div>
