<div class="chat-sidebar">
  <div class="sidebar-header">
    <div class="thread-picker">
      @if (renamingBranch()) {
        <input
          class="thread-rename-input"
          type="text"
          [ngModel]="renameDraft()"
          (ngModelChange)="updateRenameDraft($event)"
          (keydown)="onRenameKeydown($event)"
          (blur)="onRenameBlur()"
          spellcheck="false"
          autofocus
        />
      } @else {
        <select class="thread-select" [ngModel]="activeThread()" (ngModelChange)="selectThread($event)">
          @for (thread of websocketThreads(); track thread.key) {
            <option [value]="thread.key">{{ conversations.displayLabel(thread, agentId) }}</option>
          }
        </select>
      }
      @if (showThreadMenu()) {
        <button
          type="button"
          class="branch-menu-btn"
          title="Thread options"
          (click)="toggleBranchMenu($event)"
        >⋯</button>
        @if (branchMenuOpen()) {
          <div class="branch-actions" (click)="$event.stopPropagation()">
            @if (conversations.isDefaultHome(activeThread(), agentId)) {
              <button type="button" (click)="resetHome()">Reset Home…</button>
            } @else {
              <button type="button" (click)="promoteToHome()">Set as Home</button>
            }
            @if (conversations.isWebsocketBranch(activeThread())) {
              <button type="button" (click)="renameActiveBranch()">Rename</button>
              <button type="button" class="danger" (click)="deleteActiveBranch()">Delete</button>
            }
          </div>
        }
      }
    </div>
    <button class="icon-btn" type="button" title="New branch" (click)="createNewBranch()">+</button>
    <button class="close-btn" (click)="close.emit()" title="Close">&times;</button>
  </div>

  @if (threadConfirm(); as confirm) {
    <app-confirm-dialog
      [title]="confirm.title"
      [message]="confirm.message"
      [confirmLabel]="confirm.confirmLabel"
      [variant]="confirm.variant"
      (confirmed)="executeThreadConfirm()"
      (cancelled)="cancelThreadConfirm()"
    />
  }
</div>
