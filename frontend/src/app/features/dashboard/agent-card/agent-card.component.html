<div class="card" [class.card-alive]="status === 'alive'" [class.card-sleeping]="status === 'sleeping'" [class.card-paused]="isPaused">
  <div class="card-glow"></div>

  <div class="card-header">
    <div class="status-indicator">
      <div class="status-dot" [style.background]="statusColor"
           [class.pulse]="status === 'alive' || status === 'chatting'"></div>
      <span class="status-text">{{ statusLabel }}</span>
    </div>
    <div class="header-actions">
      <button (click)="togglePause.emit()" class="pause-btn" [class.pausing]="pausing" [disabled]="pausing || deleting">
        @if (pausing) {
          <span class="btn-spinner"></span>
        } @else if (isPaused) {
          Resume
        } @else {
          Pause
        }
      </button>
      <button (click)="delete.emit()" class="delete-btn" [class.deleting]="deleting" [disabled]="deleting || pausing">
        @if (deleting) {
          <span class="btn-spinner"></span> Deleting…
        } @else {
          Delete
        }
      </button>
    </div>
  </div>

  <div class="card-body">
    <h3 class="agent-name">{{ displayName }}</h3>
    <p class="agent-id">{{ agent.runtimeAgentId }}</p>
  </div>

  <div class="card-meta">
    <span class="meta-item">{{ agent.genesisVersion }}</span>
    <span class="meta-item">{{ factsCount }} facts</span>
  </div>

  <a [routerLink]="['/chat', agent.id]" class="chat-btn">
    <span class="chat-dot"></span>
    Open Chat
  </a>
</div>
