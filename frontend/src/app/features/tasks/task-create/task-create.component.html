<div class="create-wrapper">
  @if (!open) {
    <button class="add-btn" (click)="toggle()">
      <span class="plus">+</span> {{ 'tasks.create.addTask' | translate }}
    </button>
  }

  @if (open) {
    <div class="create-form" (keydown)="onKeydown($event)">
      <input
        type="text"
        class="input-title"
        [placeholder]="'tasks.create.titlePlaceholder' | translate"
        [(ngModel)]="title"
        autofocus
      />
      <textarea
        class="input-desc"
        [placeholder]="'tasks.create.descriptionPlaceholder' | translate"
        [(ngModel)]="description"
        rows="2"
      ></textarea>
      <div class="form-row">
        <select class="select-field" [(ngModel)]="priority">
          <option value="low">{{ 'tasks.priority.low' | translate }}</option>
          <option value="normal">{{ 'tasks.priority.normal' | translate }}</option>
          <option value="high">{{ 'tasks.priority.high' | translate }}</option>
          <option value="urgent">{{ 'tasks.priority.urgent' | translate }}</option>
        </select>
        <select class="select-field" [(ngModel)]="listId">
          @for (list of lists; track list.id) {
            <option [value]="list.id">{{ list.name }}</option>
          }
        </select>
        <label class="idle-toggle">
          <input type="checkbox" [(ngModel)]="idleEligible" />
          <span class="idle-label" [title]="'tasks.create.idleTitle' | translate">{{ 'tasks.create.idle' | translate }}</span>
        </label>
      </div>
      <div class="form-actions">
        <button class="btn-submit" (click)="submit()" [disabled]="!title.trim()">{{ 'tasks.create.add' | translate }}</button>
        <button class="btn-cancel" (click)="toggle()">{{ 'tasks.create.cancel' | translate }}</button>
      </div>
    </div>
  }
</div>
