# ═══════════════════════════════════════════════════════════════════════════
# NLS Domain Taxonomy Seed v1
# ═══════════════════════════════════════════════════════════════════════════
#
# This is the "parental priming" -- a structured domain hierarchy that
# guides the thalamus routing layer when classifying new LEARN signals.
#
# Like the human educational system gives every child the same baseline
# mental map (math ≠ biology ≠ history), this seed ensures the agent
# organizes knowledge into sensible categories from the start.
#
# Structure:
#   Each node has a name (the domain segment) and optional:
#   - keywords: list of terms that hint a fact belongs here
#   - children: sub-branches of this domain
#
# The taxonomy guides, it does NOT constrain. Novel domains not in this
# seed can still be created -- the agent's cortical reorganization during
# sleep will handle edge cases.
#
# Domain paths are dot-notation: Agent.Knowledge.Biology.Marine
# ═══════════════════════════════════════════════════════════════════════════

